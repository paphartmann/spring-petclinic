name: OWASP ZAP

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-scan:
    name: OWASP ZAP Full Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start Spring PetClinic
        run: |
          ./mvnw -q spring-boot:run > petclinic.log 2>&1 &
          echo $! > petclinic.pid

          for i in {1..60}; do
            if curl -fsS http://localhost:8080/ >/dev/null; then
              echo "PetClinic is running on http://localhost:8080"
              exit 0
            fi
            sleep 5
          done

          echo "PetClinic failed to start"
          cat petclinic.log
          exit 1

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'http://localhost:8080'
          cmd_options: '-a'
          allow_issue_writing: false

      - name: Show application logs on failure
        if: failure()
        run: tail -n 200 petclinic.log
