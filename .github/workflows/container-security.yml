name: Container Configuration Security

on:
  push:
    branches: [ main ]
    paths:
      - 'k8s/**'
      - '.github/workflows/container-security.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'k8s/**'
      - '.github/workflows/container-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Scan Kubernetes configuration
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/work:ro"
          -w /work
          aquasec/trivy:0.68.2
          config --exit-code 1 --severity HIGH,CRITICAL --format table /work/k8s/
